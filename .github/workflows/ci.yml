name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install code counter
        run: cargo install tokei --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Check P4 code budget
        run: ./scripts/check-budget.sh P4

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Core bridge
        run: cargo build --locked --release -p cueweave-cli
      - name: Test native app
        run: swift test --package-path apps/macos --disable-automatic-resolution
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Check timeline, settings and document boundaries
        run: |
          ./scripts/check-timeline-interaction.sh
          ./scripts/check-local-settings.sh
          ./scripts/check-document-lifecycle.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Core
        run: cargo test --locked --workspace --all-targets
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
      - name: Test viewport and settings
        run: |
          dotnet restore apps/windows/CueWeave.Windows.Tests/CueWeave.Windows.Tests.csproj --locked-mode --nologo
          dotnet build apps/windows/CueWeave.Windows.Tests/CueWeave.Windows.Tests.csproj --nologo --no-restore
          ./apps/windows/CueWeave.Windows.Tests/bin/Debug/net10.0-windows10.0.26100.0/CueWeave.Windows.Tests.exe
      - name: Build the unpackaged WinUI application
        run: |
          dotnet restore apps/windows/CueWeave.Windows/CueWeave.Windows.csproj -r win-x64 --locked-mode --nologo
          dotnet publish apps/windows/CueWeave.Windows/CueWeave.Windows.csproj -c Release -r win-x64 --self-contained --no-restore -p:Platform=x64

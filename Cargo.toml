[workspace]
members = [
    "crates/cueweave-core",
    "crates/cueweave-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/ZUENS2020/CueWeave"

[workspace.dependencies]
aes = "0.8"
base64 = "0.22"
id3 = "1.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
